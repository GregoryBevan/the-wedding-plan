spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
  main:
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: always

app:
  auth:
    allowed-emails:
      - gregory@example.com
    success-redirect-url: http://localhost:5173
  guest-access:
    base-url: http://localhost:8080
    guest-area-url: http://localhost:5174/guest-access/secured-area
    jwt-secret: test-guest-access-jwt-secret-0123456789
  cors:
    allowed-origins:
      - http://localhost:5173
