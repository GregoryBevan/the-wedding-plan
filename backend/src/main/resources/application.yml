server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:lax}
        secure: ${APP_SESSION_COOKIE_SECURE:true}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  task:
    execution:
      # Let in-flight @Async tasks (the best-effort playlist sync) drain on shutdown so a normal
      # redeploy doesn't drop one. Anything not drained in time stays pending for the daily reconciler.
      shutdown:
        await-termination: true
        await-termination-period: 20s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          # Implicit TLS (SMTPS) — enable for port 465. Mutually exclusive with STARTTLS (port 587).
          ssl:
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

app:
  auth:
    allowed-emails: ${APP_AUTH_ALLOWED_EMAILS:}
    success-redirect-url: ${APP_AUTH_SUCCESS_REDIRECT_URL:}
    rate-limit:
      enabled: ${APP_AUTH_RATE_LIMIT_ENABLED:true}
      max-requests-per-window: ${APP_AUTH_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW:60}
      window-seconds: ${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  mail:
    from: ${APP_MAIL_FROM:no-reply@localhost}
    # Magic-link email transport: smtp (local/Mailpit), brevo (prod — Render blocks outbound SMTP), or noop.
    provider: ${APP_MAIL_PROVIDER:smtp}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com}
    sender-name: ${BREVO_SENDER_NAME:DYWY}
  guest:
    default-language: ${APP_GUEST_DEFAULT_LANGUAGE:FR}
  deezer:
    access-token: ${APP_DEEZER_ACCESS_TOKEN}
    base-url: ${APP_DEEZER_BASE_URL:https://api.deezer.com}
    playlist-id: ${APP_DEEZER_PLAYLIST_ID}
    connect-timeout: ${APP_DEEZER_CONNECT_TIMEOUT:2s}
    read-timeout: ${APP_DEEZER_READ_TIMEOUT:3s}
  guest-access:
    base-url: ${APP_GUEST_ACCESS_BASE_URL}
    guest-area-url: ${APP_GUEST_AREA_URL}
    magic-link-ttl-seconds: ${APP_GUEST_ACCESS_MAGIC_LINK_TTL_SECONDS:900}
    guest-session-ttl-seconds: ${APP_GUEST_ACCESS_GUEST_SESSION_TTL_SECONDS:1800}
    jwt-secret: ${APP_GUEST_ACCESS_JWT_SECRET}
    session-cookie-secure: ${APP_GUEST_ACCESS_SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: ${APP_GUEST_ACCESS_SESSION_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-origin-patterns: []
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: [Authorization, Content-Type, Accept, Origin, X-XSRF-TOKEN]
    allow-credentials: true
