[versions]
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
dependency-update = "1.1.1"
exposed = "1.3.1"
uuid-creator = "6.1.1"
kotlin-logging-jvm = "8.0.4"
mockk = "1.14.11"
test-containers = "2.0.5"
assertk-jvm = "0.28.1"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
dependency-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "dependency-update" }

[libraries]
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
exposed-spring-boot = { module = "org.jetbrains.exposed:exposed-spring-boot4-starter", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
kotlin-logging-jvm = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging-jvm" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-agent = { module = "io.mockk:mockk-agent", version.ref = "mockk" }
assertk-jvm = { module = "com.willowtreeapps.assertk:assertk-jvm", version.ref = "assertk-jvm" }
test-containers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "test-containers" }
